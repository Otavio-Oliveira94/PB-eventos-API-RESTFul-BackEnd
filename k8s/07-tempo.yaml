apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-dados
  namespace: eventos-express
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: eventos-express
spec:
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: eventos-express
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: preparar-volume
          image: busybox:1.37
          command: ["sh", "-c", "chown -R 10001:10001 /dados"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: dados
              mountPath: /dados
      containers:
        - name: tempo
          image: grafana/tempo:3.1.0
          args:
            - -config.file=/etc/tempo/tempo-config.yml
            - -target=all
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-http
              containerPort: 4318
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/tempo/tempo-config.yml
              subPath: tempo-config.yml
              readOnly: true
            - name: dados
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: dados
          persistentVolumeClaim:
            claimName: tempo-dados