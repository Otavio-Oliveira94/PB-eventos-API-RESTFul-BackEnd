apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-dados
  namespace: eventos-express
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: eventos-express
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: eventos-express
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: preparar-volume
          image: busybox:1.37
          command: ["sh", "-c", "chown -R 10001:10001 /dados"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: dados
              mountPath: /dados
      containers:
        - name: loki
          image: grafana/loki:3.7.8
          args: ["-config.file=/etc/loki/loki-config.yml"]
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
          ports:
            - name: http
              containerPort: 3100
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/loki/loki-config.yml
              subPath: loki-config.yml
              readOnly: true
            - name: dados
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: dados
          persistentVolumeClaim:
            claimName: loki-dados