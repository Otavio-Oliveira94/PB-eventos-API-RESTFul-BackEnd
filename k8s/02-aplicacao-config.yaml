apiVersion: v1
kind: ConfigMap
metadata:
  name: aplicacao-config
  namespace: eventos-express
data:
  SPRING_PROFILES_ACTIVE: "container"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0"
  MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "true"
  TRACING_OTLP_ENDPOINT: "http://tempo:4318/v1/traces"