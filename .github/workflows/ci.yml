name: CI/CD - Eventos Service

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Testes, build e imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Preparar o Maven Wrapper para Linux
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Executar testes e gerar o JAR
        run: ./mvnw -B -ntp clean verify

      - name: Guardar os relatorios dos testes
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-testes-eventos
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validar a construcao da imagem Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: eventos-express/eventos-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publicar:
    name: Publicar imagem no GHCR
    needs: validar
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Definir o nome da imagem
        id: imagem
        run: |
          image_owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "nome=ghcr.io/${image_owner}/eventos-service" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.imagem.outputs.nome }}:latest
            ${{ steps.imagem.outputs.nome }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max