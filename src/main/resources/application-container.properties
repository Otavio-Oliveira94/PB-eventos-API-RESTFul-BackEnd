# Cabecalhos encaminhados pelo proxy
server.forward-headers-strategy=framework

# Banco persistente no container
spring.datasource.url=${DB_URL:jdbc:h2:file:/app/data/eventosdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Auditoria persistente no container
auditoria.arquivo=${AUDITORIA_ARQUIVO:/app/logs/auditoria-eventos.jsonl}

# RabbitMQ na rede Docker
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}

# Envio de traces para o Tempo
management.tracing.export.otlp.enabled=true

management.opentelemetry.tracing.export.otlp.endpoint=${TRACING_OTLP_ENDPOINT:http://tempo:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http

management.opentelemetry.tracing.export.otlp.connect-timeout=2s
management.opentelemetry.tracing.export.otlp.timeout=5s