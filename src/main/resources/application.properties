spring.application.name=eventos-service
spring.profiles.default=local
server.port=${SERVER_PORT:8080}

# Encerramento da aplicacao
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Banco H2 nesta primeira etapa
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# RabbitMQ
spring.rabbitmq.connection-timeout=5s

# Retry dos consumidores
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=5s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Retry e confirmacao das publicacoes
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-retries=3
spring.rabbitmq.template.retry.initial-interval=1s
spring.rabbitmq.template.retry.multiplier=2.0
spring.rabbitmq.template.retry.max-interval=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

mensageria.verificar-conexao=${MENSAGERIA_VERIFICAR_CONEXAO:false}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,rabbit

# Informacoes da aplicacao
management.info.env.enabled=true
info.app.nome=${spring.application.name}
info.app.descricao=Microsservico de eventos do Eventos Express