spring.application.name=eventos-service

server.port=8080

#H2
spring.datasource.url=jdbc:h2:file:./data/eventosdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Histórico de alterações em arquivo, independente do banco H2.
auditoria.arquivo=${AUDITORIA_ARQUIVO:./logs/auditoria-eventos.jsonl}

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=eventos
spring.rabbitmq.password=eventos123
spring.rabbitmq.virtual-host=/