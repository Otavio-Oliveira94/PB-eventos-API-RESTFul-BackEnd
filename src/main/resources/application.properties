spring.application.name=eventos-service

server.port=8080

#H2
spring.datasource.url=jdbc:h2:file:./data/eventosdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Historico de alteracoes em arquivo, independente do banco H2.
auditoria.arquivo=${AUDITORIA_ARQUIVO:./logs/auditoria-eventos.jsonl}

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=eventos
spring.rabbitmq.password=eventos123
spring.rabbitmq.virtual-host=/

# Retry dos consumidores RabbitMQ
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=5s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Retry e confirmacao das publicacoes RabbitMQ
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-retries=3
spring.rabbitmq.template.retry.initial-interval=1s
spring.rabbitmq.template.retry.multiplier=2.0
spring.rabbitmq.template.retry.max-interval=5s

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true