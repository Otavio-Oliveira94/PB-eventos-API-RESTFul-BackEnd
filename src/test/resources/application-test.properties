# Banco isolado dos dados locais
spring.datasource.url=jdbc:h2:mem:eventos_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Auditoria isolada por contexto de teste
auditoria.arquivo=${java.io.tmpdir}/eventos-express-tests/${random.uuid}/auditoria-eventos.jsonl

# Os testes atuais nao dependem de um broker externo
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.auto-startup=false
mensageria.verificar-conexao=false

# A saude dos testes nao depende do RabbitMQ
management.health.rabbit.enabled=false
management.endpoint.health.group.readiness.include=readinessState,db