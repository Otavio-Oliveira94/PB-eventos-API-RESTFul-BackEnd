services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: eventos-rabbitmq
    container_name: eventos-rabbitmq
    restart: unless-stopped

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME no arquivo .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VIRTUAL_HOST:-/}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  eventos-service:
    image: eventos-express/eventos-service:local

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    stop_grace_period: 40s

    environment:
      SPRING_PROFILES_ACTIVE: container
      SERVER_PORT: "8080"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME no arquivo .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:-/}

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - eventos_data:/app/data
      - eventos_logs:/app/logs

    depends_on:
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s

  inscricoes-service:
    image: eventos-express/inscricoes-service:local

    build:
      context: ../inscricoes-service
      dockerfile: Dockerfile

    restart: unless-stopped
    stop_grace_period: 40s

    environment:
      SPRING_PROFILES_ACTIVE: container
      SERVER_PORT: "8081"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME no arquivo .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:-/}

    ports:
      - "127.0.0.1:8081:8081"

    volumes:
      - inscricoes_data:/app/data
      - inscricoes_logs:/app/logs

    depends_on:
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s

  frontend:
    image: eventos-express/frontend:local

    build:
      context: ../eventos-front
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:8082:80"

    depends_on:
      eventos-service:
        condition: service_healthy
      inscricoes-service:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  rabbitmq_data:
  eventos_data:
  eventos_logs:
  inscricoes_data:
  inscricoes_logs: