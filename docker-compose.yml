x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: eventos-rabbitmq
    container_name: eventos-rabbitmq
    restart: unless-stopped
    logging: *default-logging
    labels:
      com.eventosexpress.logs: "true"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME no arquivo .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VIRTUAL_HOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  eventos-service:
    image: eventos-express/eventos-service:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    labels:
      com.eventosexpress.logs: "true"
    stop_grace_period: 40s
    environment:
      SPRING_PROFILES_ACTIVE: container
      SERVER_PORT: "8080"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME no arquivo .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:-/}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - eventos_data:/app/data
      - eventos_logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s

  inscricoes-service:
    image: eventos-express/inscricoes-service:local
    build:
      context: ../inscricoes-service
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    labels:
      com.eventosexpress.logs: "true"
    stop_grace_period: 40s
    environment:
      SPRING_PROFILES_ACTIVE: container
      SERVER_PORT: "8081"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME no arquivo .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:-/}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - inscricoes_data:/app/data
      - inscricoes_logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s

  frontend:
    image: eventos-express/frontend:local
    build:
      context: ../eventos-front
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    labels:
      com.eventosexpress.logs: "true"
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      eventos-service:
        condition: service_healthy
      inscricoes-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    logging: *default-logging
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observabilidade/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    logging: *default-logging
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observabilidade/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started

  tempo:
    image: grafana/tempo:3.1.0
    restart: unless-stopped
    logging: *default-logging
    command:
      - -config.file=/etc/tempo/tempo-config.yml
      - -target=all
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./observabilidade/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Defina GRAFANA_ADMIN_USER no arquivo .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD no arquivo .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started

volumes:
  rabbitmq_data:
  eventos_data:
  eventos_logs:
  inscricoes_data:
  inscricoes_logs:
  loki_data:
  alloy_data:
  grafana_data:
  tempo_data: